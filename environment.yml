name: braker3_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.8
  - perl>=5.26
  - biopython>=1.78
  - numpy>=1.20
  - scipy>=1.6
  
  # Sequence processing
  - seqkit>=2.3.0
  
  # Aligners and mappers
  - star>=2.7.9a
  
  # SAM/BAM processing
  - samtools>=1.14
  
  # GTF/GFF processing
  - gffread>=0.12.1
  
  # Repeat masking
  - repeatmodeler>=2.0.1
  - repeatmasker>=4.1.2
  
  # Gene prediction (for local references)
  - augustus>=3.4.0
  
  # Transcript assembly
  - stringtie>=2.2.0
  
  # HMMER for protein analysis
  - hmmer>=3.3.2
  
  # USearch/CD-HIT for clustering
  - usearch>=11.0.667
  
  # Bedtools
  - bedtools2>=2.30.0
  
  # BEDOPS
  - bedops>=2.4.40
  
  # GNU Parallel
  - parallel>=20210422
  
  # Other utilities
  - grep
  - sed
  - awk
  - bc
  - coreutils

  # NCBI Blast+ for protein homology
  - blast>=2.12.0

  # Diamond (faster than BLAST)
  - diamond>=2.0.15

  # SQLite3 (needed by some tools)
  - sqlite>=3.36.0

# pip packages
pip:
  - pandas>=1.3.0
  - pyfaidx>=0.7.0

# System requirements:
# - Singularity/Apptainer runtime
# - 64GB+ RAM recommended
# - 32 CPU cores recommended
#
# For BRAKER3 container, use:
# singularity pull braker3.sif docker://teambraker/braker3:latest
#
# Or download from:
# https://github.com/Gaius-Augustus/BRAKER

# Note: Key tools (BRAKER, TSEBRA, GeneMark) are run via Singularity
# This conda environment provides:
# - STAR for RNA-seq alignment
# - SAMtools for BAM processing  
# - GFFRead for format conversion
# - SeqKit for sequence manipulation
# - StringTie for transcript assembly
# - RepeatMasker/RepeatModeler for repeat annotation